<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Agent Team OS. A wire format and tool pack for multi-role agent work. Local checks catch missing brief fields, dependency cycles, unsourced claims, and stale audit rechecks."><title>Agent Team OS. A wire format and tool pack for multi-role agent work. Local checks catch missing brief fields, dependency cycles, unsourced claims, and stale audit rechecks.</title><style>.star{animation:glimmer 9s ease-in-out infinite}@keyframes glimmer{0%,100%{opacity:.65}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.star{animation:none}}</style><rect width="1200" height="320" rx="12" fill="#111820"/><text x="55" y="85" fill="#E9F0F3" font-size="42.5" font-family="Georgia, serif"><tspan x="55" dy="0">Agent Team OS</tspan></text><text x="57" y="135" fill="#B4C6CB" font-size="22.5" font-family="Georgia, serif" font-style="italic"><tspan x="57" dy="0">Wire format for multi-role agent work</tspan></text><text x="57" y="202" fill="#B4C6CB" font-size="23.33" font-family="Georgia, serif"><tspan x="57" dy="0">Brief every role in six fields.</tspan><tspan x="57" dy="31.4955">Check each handoff before it leaves.</tspan></text><path d="M714 52 L714 268" fill="none" stroke="#344B4A" stroke-width="1.7"/><text x="765" y="70" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif" font-style="italic"><tspan x="765" dy="0">What the checks catch</tspan></text><text x="765" y="118" fill="#E9F0F3" font-size="20.83" font-family="Georgia, serif"><tspan x="765" dy="0">Brief</tspan></text><path d="M893 109 L934 109" fill="none" stroke="#344B4A" stroke-width="1.7"/><g><circle cx="934" cy="109" r="12" fill="#5DDBAE" opacity=".06"/><path d="M922 109 H946 M934 97 V121" stroke="#5DDBAE" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-0s" cx="934" cy="109" r="3.5" fill="#5DDBAE"/></g><text x="957" y="118" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif"><tspan x="957" dy="0">Missing fields</tspan></text><text x="765" y="162" fill="#E9F0F3" font-size="20.83" font-family="Georgia, serif"><tspan x="765" dy="0">Plan</tspan></text><path d="M893 153 L934 153" fill="none" stroke="#344B4A" stroke-width="1.7"/><g><circle cx="934" cy="153" r="12" fill="#5DDBAE" opacity=".06"/><path d="M922 153 H946 M934 141 V165" stroke="#5DDBAE" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-1.7s" cx="934" cy="153" r="3.5" fill="#5DDBAE"/></g><text x="957" y="162" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif"><tspan x="957" dy="0">Dependency cycles</tspan></text><text x="765" y="206" fill="#E9F0F3" font-size="20.83" font-family="Georgia, serif"><tspan x="765" dy="0">Evidence</tspan></text><path d="M893 197 L934 197" fill="none" stroke="#344B4A" stroke-width="1.7"/><g><circle cx="934" cy="197" r="12" fill="#5DDBAE" opacity=".06"/><path d="M922 197 H946 M934 185 V209" stroke="#5DDBAE" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-3.4s" cx="934" cy="197" r="3.5" fill="#5DDBAE"/></g><text x="957" y="206" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif"><tspan x="957" dy="0">Unsourced claims</tspan></text><text x="765" y="250" fill="#E9F0F3" font-size="20.83" font-family="Georgia, serif"><tspan x="765" dy="0">Audit</tspan></text><path d="M893 241 L934 241" fill="none" stroke="#344B4A" stroke-width="1.7"/><g><circle cx="934" cy="241" r="12" fill="#5DDBAE" opacity=".06"/><path d="M922 241 H946 M934 229 V253" stroke="#5DDBAE" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-5.1s" cx="934" cy="241" r="3.5" fill="#5DDBAE"/></g><text x="957" y="250" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif"><tspan x="957" dy="0">Stale rechecks</tspan></text></svg>
