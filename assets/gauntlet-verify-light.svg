<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Gauntlet Verify. A fork of the Gauntlet Loop that runs in two modes: blind judges hold a build to a shipped reference, and isolated verifiers label each claim verified, reported, or unverified."><title>Gauntlet Verify. A fork of the Gauntlet Loop that runs in two modes: blind judges hold a build to a shipped reference, and isolated verifiers label each claim verified, reported, or unverified.</title><style>.star{animation:glimmer 9s ease-in-out infinite}@keyframes glimmer{0%,100%{opacity:.65}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.star{animation:none}}</style><rect width="1200" height="320" rx="12" fill="#F6F8FA"/><text x="55" y="85" fill="#17232B" font-size="42.5" font-family="Georgia, serif"><tspan x="55" dy="0">Gauntlet Verify</tspan></text><text x="57" y="135" fill="#4F6269" font-size="22.5" font-family="Georgia, serif" font-style="italic"><tspan x="57" dy="0">A fork of the Gauntlet Loop, in two modes</tspan></text><text x="57" y="202" fill="#4F6269" font-size="23.33" font-family="Georgia, serif"><tspan x="57" dy="0">Match a shipped reference with blind judges.</tspan><tspan x="57" dy="31.4955">Verify load-bearing claims with isolated agents.</tspan></text><path d="M714 52 L714 268" fill="none" stroke="#CCDAD7" stroke-width="1.7"/><text x="765" y="70" fill="#4F6269" font-size="20.83" font-family="Georgia, serif" font-style="italic"><tspan x="765" dy="0">Every claim ships labeled</tspan></text><text x="765" y="122" fill="#17232B" font-size="20.83" font-family="Georgia, serif"><tspan x="765" dy="0">Verified</tspan></text><path d="M893 113 L934 113" fill="none" stroke="#CCDAD7" stroke-width="1.7"/><g><circle cx="934" cy="113" r="12" fill="#087F62" opacity=".06"/><path d="M922 113 H946 M934 101 V125" stroke="#087F62" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-0s" cx="934" cy="113" r="3.5" fill="#087F62"/></g><text x="957" y="122" fill="#4F6269" font-size="20.83" font-family="Georgia, serif"><tspan x="957" dy="0">Primary or two reports</tspan></text><text x="765" y="178" fill="#17232B" font-size="20.83" font-family="Georgia, serif"><tspan x="765" dy="0">Reported</tspan></text><path d="M893 169 L934 169" fill="none" stroke="#CCDAD7" stroke-width="1.7"/><g><circle cx="934" cy="169" r="12" fill="#087F62" opacity=".06"/><path d="M922 169 H946 M934 157 V181" stroke="#087F62" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-1.7s" cx="934" cy="169" r="3.5" fill="#087F62"/></g><text x="957" y="178" fill="#4F6269" font-size="20.83" font-family="Georgia, serif"><tspan x="957" dy="0">Single report</tspan></text><text x="765" y="234" fill="#17232B" font-size="20.83" font-family="Georgia, serif"><tspan x="765" dy="0">Unverified</tspan></text><path d="M893 225 L934 225" fill="none" stroke="#CCDAD7" stroke-width="1.7"/><g><circle cx="934" cy="225" r="12" fill="#087F62" opacity=".06"/><path d="M922 225 H946 M934 213 V237" stroke="#087F62" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-3.4s" cx="934" cy="225" r="3.5" fill="#087F62"/></g><text x="957" y="234" fill="#4F6269" font-size="20.83" font-family="Georgia, serif"><tspan x="957" dy="0">Everything else</tspan></text></svg>
