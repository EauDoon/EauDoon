<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="Blitz. Minimum Viable Company kit. Four evidence gates take one bounded offer through a real test to an accepted result and a feasible next cycle."><title>Blitz. Minimum Viable Company kit. Four evidence gates take one bounded offer through a real test to an accepted result and a feasible next cycle.</title><style>.star{animation:glimmer 9s ease-in-out infinite}@keyframes glimmer{0%,100%{opacity:.65}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.star{animation:none}}</style><rect width="600" height="560" rx="12" fill="#111820"/><text x="40" y="76" fill="#E9F0F3" font-size="35.83" font-family="Georgia, serif"><tspan x="40" dy="0">Blitz</tspan></text><text x="42" y="123" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif" font-style="italic"><tspan x="42" dy="0">Minimum Viable Company kit</tspan></text><text x="42" y="182" fill="#B4C6CB" font-size="22.5" font-family="Georgia, serif"><tspan x="42" dy="0">Listen, collect, sprint.</tspan><tspan x="42" dy="30.375000000000004">Reduce cycle time.</tspan></text><path d="M42 303 L558 303" fill="none" stroke="#55343A" stroke-width="1.7"/><text x="44" y="343" fill="#B4C6CB" font-size="20" font-family="Georgia, serif" font-style="italic"><tspan x="44" dy="0">Four evidence gates</tspan></text><text x="44" y="391" fill="#E9F0F3" font-size="20.83" font-family="Georgia, serif"><tspan x="44" dy="0">Frame</tspan></text><path d="M172 382 L213 382" fill="none" stroke="#55343A" stroke-width="1.7"/><g><circle cx="213" cy="382" r="12" fill="#FF5C5C" opacity=".06"/><path d="M201 382 H225 M213 370 V394" stroke="#FF5C5C" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-0s" cx="213" cy="382" r="3.5" fill="#FF5C5C"/></g><text x="236" y="391" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif"><tspan x="236" dy="0">Bounded offer</tspan></text><text x="44" y="435" fill="#E9F0F3" font-size="20.83" font-family="Georgia, serif"><tspan x="44" dy="0">Test</tspan></text><path d="M172 426 L213 426" fill="none" stroke="#55343A" stroke-width="1.7"/><g><circle cx="213" cy="426" r="12" fill="#FF5C5C" opacity=".06"/><path d="M201 426 H225 M213 414 V438" stroke="#FF5C5C" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-1.7s" cx="213" cy="426" r="3.5" fill="#FF5C5C"/></g><text x="236" y="435" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif"><tspan x="236" dy="0">Hardest assumption</tspan></text><text x="44" y="479" fill="#E9F0F3" font-size="20.83" font-family="Georgia, serif"><tspan x="44" dy="0">Deliver</tspan></text><path d="M172 470 L213 470" fill="none" stroke="#55343A" stroke-width="1.7"/><g><circle cx="213" cy="470" r="12" fill="#FF5C5C" opacity=".06"/><path d="M201 470 H225 M213 458 V482" stroke="#FF5C5C" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-3.4s" cx="213" cy="470" r="3.5" fill="#FF5C5C"/></g><text x="236" y="479" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif"><tspan x="236" dy="0">Accepted result</tspan></text><text x="44" y="523" fill="#E9F0F3" font-size="20.83" font-family="Georgia, serif"><tspan x="44" dy="0">Operate</tspan></text><path d="M172 514 L213 514" fill="none" stroke="#55343A" stroke-width="1.7"/><g><circle cx="213" cy="514" r="12" fill="#FF5C5C" opacity=".06"/><path d="M201 514 H225 M213 502 V526" stroke="#FF5C5C" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-5.1s" cx="213" cy="514" r="3.5" fill="#FF5C5C"/></g><text x="236" y="523" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif"><tspan x="236" dy="0">Next cycle</tspan></text></svg>
