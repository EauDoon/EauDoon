<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Blitz. Minimum Viable Company kit. Four evidence gates take one bounded offer through a real test to an accepted result and a feasible next cycle."><title>Blitz. Minimum Viable Company kit. Four evidence gates take one bounded offer through a real test to an accepted result and a feasible next cycle.</title><style>.star{animation:glimmer 9s ease-in-out infinite}@keyframes glimmer{0%,100%{opacity:.65}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.star{animation:none}}</style><rect width="1200" height="320" rx="12" fill="#F6F8FA"/><text x="55" y="85" fill="#17232B" font-size="42.5" font-family="Georgia, serif"><tspan x="55" dy="0">Blitz</tspan></text><text x="57" y="135" fill="#4F6269" font-size="22.5" font-family="Georgia, serif" font-style="italic"><tspan x="57" dy="0">Minimum Viable Company kit</tspan></text><text x="57" y="202" fill="#4F6269" font-size="23.33" font-family="Georgia, serif"><tspan x="57" dy="0">Listen, collect, sprint.</tspan><tspan x="57" dy="31.4955">Reduce cycle time.</tspan></text><path d="M714 52 L714 268" fill="none" stroke="#EBCDD0" stroke-width="1.7"/><text x="765" y="70" fill="#4F6269" font-size="20.83" font-family="Georgia, serif" font-style="italic"><tspan x="765" dy="0">Four evidence gates</tspan></text><text x="765" y="118" fill="#17232B" font-size="20.83" font-family="Georgia, serif"><tspan x="765" dy="0">Frame</tspan></text><path d="M893 109 L934 109" fill="none" stroke="#EBCDD0" stroke-width="1.7"/><g><circle cx="934" cy="109" r="12" fill="#CF222E" opacity=".06"/><path d="M922 109 H946 M934 97 V121" stroke="#CF222E" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-0s" cx="934" cy="109" r="3.5" fill="#CF222E"/></g><text x="957" y="118" fill="#4F6269" font-size="20.83" font-family="Georgia, serif"><tspan x="957" dy="0">Bounded offer</tspan></text><text x="765" y="162" fill="#17232B" font-size="20.83" font-family="Georgia, serif"><tspan x="765" dy="0">Test</tspan></text><path d="M893 153 L934 153" fill="none" stroke="#EBCDD0" stroke-width="1.7"/><g><circle cx="934" cy="153" r="12" fill="#CF222E" opacity=".06"/><path d="M922 153 H946 M934 141 V165" stroke="#CF222E" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-1.7s" cx="934" cy="153" r="3.5" fill="#CF222E"/></g><text x="957" y="162" fill="#4F6269" font-size="20.83" font-family="Georgia, serif"><tspan x="957" dy="0">Hardest assumption</tspan></text><text x="765" y="206" fill="#17232B" font-size="20.83" font-family="Georgia, serif"><tspan x="765" dy="0">Deliver</tspan></text><path d="M893 197 L934 197" fill="none" stroke="#EBCDD0" stroke-width="1.7"/><g><circle cx="934" cy="197" r="12" fill="#CF222E" opacity=".06"/><path d="M922 197 H946 M934 185 V209" stroke="#CF222E" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-3.4s" cx="934" cy="197" r="3.5" fill="#CF222E"/></g><text x="957" y="206" fill="#4F6269" font-size="20.83" font-family="Georgia, serif"><tspan x="957" dy="0">Accepted result</tspan></text><text x="765" y="250" fill="#17232B" font-size="20.83" font-family="Georgia, serif"><tspan x="765" dy="0">Operate</tspan></text><path d="M893 241 L934 241" fill="none" stroke="#EBCDD0" stroke-width="1.7"/><g><circle cx="934" cy="241" r="12" fill="#CF222E" opacity=".06"/><path d="M922 241 H946 M934 229 V253" stroke="#CF222E" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-5.1s" cx="934" cy="241" r="3.5" fill="#CF222E"/></g><text x="957" y="250" fill="#4F6269" font-size="20.83" font-family="Georgia, serif"><tspan x="957" dy="0">Next cycle</tspan></text></svg>
