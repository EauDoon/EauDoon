<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="MandateBound. Experimental evidence review for agentic commerce. The synthetic example distinguishes a complete case, missing evidence, and tampering."><title>MandateBound. Experimental evidence review for agentic commerce. The synthetic example distinguishes a complete case, missing evidence, and tampering.</title><style>.star{animation:glimmer 9s ease-in-out infinite}@keyframes glimmer{0%,100%{opacity:.65}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.star{animation:none}}</style><rect width="600" height="560" rx="12" fill="#111820"/><text x="40" y="76" fill="#E9F0F3" font-size="43" font-family="Georgia, serif"><tspan x="40" dy="0">MandateBound</tspan></text><text x="42" y="123" fill="#B4C6CB" font-size="25" font-family="Georgia, serif" font-style="italic"><tspan x="42" dy="0">Evidence review for agentic commerce</tspan></text><text x="42" y="182" fill="#B4C6CB" font-size="27" font-family="Georgia, serif"><tspan x="42" dy="0">Replay a disputed purchase from its</tspan><tspan x="42" dy="36.45">evidence. Keep missing or invalid</tspan><tspan x="42" dy="36.45">records unresolved.</tspan></text><path d="M42 303 L558 303" fill="none" stroke="#344B4A" stroke-width="1.7"/><text x="44" y="343" fill="#B4C6CB" font-size="24" font-family="Georgia, serif" font-style="italic"><tspan x="44" dy="0">Synthetic worked case</tspan></text><text x="44" y="395" fill="#E9F0F3" font-size="25" font-family="Georgia, serif"><tspan x="44" dy="0">Complete</tspan></text><path d="M172 386 L213 386" fill="none" stroke="#344B4A" stroke-width="1.7"/><g><circle cx="213" cy="386" r="12" fill="#5DDBAE" opacity=".06"/><path d="M201 386 H225 M213 374 V398" stroke="#5DDBAE" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-0s" cx="213" cy="386" r="3.5" fill="#5DDBAE"/></g><text x="236" y="395" fill="#B4C6CB" font-size="25" font-family="Georgia, serif"><tspan x="236" dy="0">Allocated</tspan></text><text x="44" y="451" fill="#E9F0F3" font-size="25" font-family="Georgia, serif"><tspan x="44" dy="0">Missing</tspan></text><path d="M172 442 L213 442" fill="none" stroke="#344B4A" stroke-width="1.7"/><g><circle cx="213" cy="442" r="12" fill="#5DDBAE" opacity=".06"/><path d="M201 442 H225 M213 430 V454" stroke="#5DDBAE" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-1.7s" cx="213" cy="442" r="3.5" fill="#5DDBAE"/></g><text x="236" y="451" fill="#B4C6CB" font-size="25" font-family="Georgia, serif"><tspan x="236" dy="0">Indeterminate</tspan></text><text x="44" y="507" fill="#E9F0F3" font-size="25" font-family="Georgia, serif"><tspan x="44" dy="0">Tampered</tspan></text><path d="M172 498 L213 498" fill="none" stroke="#344B4A" stroke-width="1.7"/><g><circle cx="213" cy="498" r="12" fill="#5DDBAE" opacity=".06"/><path d="M201 498 H225 M213 486 V510" stroke="#5DDBAE" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-3.4s" cx="213" cy="498" r="3.5" fill="#5DDBAE"/></g><text x="236" y="507" fill="#B4C6CB" font-size="25" font-family="Georgia, serif"><tspan x="236" dy="0">Invalid</tspan></text></svg>
