<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="MandateBound. Experimental evidence review for agentic commerce. The synthetic example distinguishes a complete case, missing evidence, and tampering."><title>MandateBound. Experimental evidence review for agentic commerce. The synthetic example distinguishes a complete case, missing evidence, and tampering.</title><style>.star{animation:glimmer 9s ease-in-out infinite}@keyframes glimmer{0%,100%{opacity:.65}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.star{animation:none}}</style><rect width="1200" height="320" rx="12" fill="#111820"/><text x="55" y="85" fill="#E9F0F3" font-size="34" font-family="Georgia, serif"><tspan x="55" dy="0">MandateBound</tspan></text><text x="57" y="135" fill="#B4C6CB" font-size="18" font-family="Georgia, serif" font-style="italic"><tspan x="57" dy="0">Evidence review for agentic commerce</tspan></text><text x="57" y="202" fill="#B4C6CB" font-size="18.67" font-family="Georgia, serif"><tspan x="57" dy="0">Replay a disputed purchase from its evidence.</tspan><tspan x="57" dy="25.204500000000003">Keep missing or invalid records unresolved.</tspan></text><path d="M714 52 L714 268" fill="none" stroke="#344B4A" stroke-width="1.7"/><text x="765" y="70" fill="#B4C6CB" font-size="16.67" font-family="Georgia, serif" font-style="italic"><tspan x="765" dy="0">Synthetic worked case</tspan></text><text x="765" y="122" fill="#E9F0F3" font-size="16.67" font-family="Georgia, serif"><tspan x="765" dy="0">Complete</tspan></text><path d="M893 113 L934 113" fill="none" stroke="#344B4A" stroke-width="1.7"/><g><circle cx="934" cy="113" r="12" fill="#5DDBAE" opacity=".06"/><path d="M922 113 H946 M934 101 V125" stroke="#5DDBAE" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-0s" cx="934" cy="113" r="3.5" fill="#5DDBAE"/></g><text x="957" y="122" fill="#B4C6CB" font-size="16.67" font-family="Georgia, serif"><tspan x="957" dy="0">Allocated</tsp