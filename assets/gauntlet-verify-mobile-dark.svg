<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img" aria-label="Gauntlet Verify. A fork of the Gauntlet Loop that runs in two modes: blind judges hold a build to a shipped reference, and isolated verifiers label each claim verified, reported, or unverified."><title>Gauntlet Verify. A fork of the Gauntlet Loop that runs in two modes: blind judges hold a build to a shipped reference, and isolated verifiers label each claim verified, reported, or unverified.</title><style>.star{animation:glimmer 9s ease-in-out infinite}@keyframes glimmer{0%,100%{opacity:.65}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.star{animation:none}}</style><rect width="600" height="560" rx="12" fill="#111820"/><text x="40" y="76" fill="#E9F0F3" font-size="35.83" font-family="Georgia, serif"><tspan x="40" dy="0">Gauntlet Verify</tspan></text><text x="42" y="123" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif" font-style="italic"><tspan x="42" dy="0">A fork of the Gauntlet Loop, in two modes</tspan></text><text x="42" y="182" fill="#B4C6CB" font-size="22.5" font-family="Georgia, serif"><tspan x="42" dy="0">Match a shipped reference with</tspan><tspan x="42" dy="30.375000000000004">blind judges. Verify load-bearing</tspan><tspan x="42" dy="30.375000000000004">claims with isolated agents.</tspan></text><path d="M42 303 L558 303" fill="none" stroke="#344B4A" stroke-width="1.7"/><text x="44" y="343" fill="#B4C6CB" font-size="20" font-family="Georgia, serif" font-style="italic"><tspan x="44" dy="0">Every claim ships labeled</tspan></text><text x="44" y="395" fill="#E9F0F3" font-size="20.83" font-family="Georgia, serif"><tspan x="44" dy="0">Verified</tspan></text><path d="M172 386 L213 386" fill="none" stroke="#344B4A" stroke-width="1.7"/><g><circle cx="213" cy="386" r="12" fill="#5DDBAE" opacity=".06"/><path d="M201 386 H225 M213 374 V398" stroke="#5DDBAE" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-0s" cx="213" cy="386" r="3.5" fill="#5DDBAE"/></g><text x="236" y="395" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif"><tspan x="236" dy="0">Primary or two reports</tspan></text><text x="44" y="451" fill="#E9F0F3" font-size="20.83" font-family="Georgia, serif"><tspan x="44" dy="0">Reported</tspan></text><path d="M172 442 L213 442" fill="none" stroke="#344B4A" stroke-width="1.7"/><g><circle cx="213" cy="442" r="12" fill="#5DDBAE" opacity=".06"/><path d="M201 442 H225 M213 430 V454" stroke="#5DDBAE" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-1.7s" cx="213" cy="442" r="3.5" fill="#5DDBAE"/></g><text x="236" y="451" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif"><tspan x="236" dy="0">Single report</tspan></text><text x="44" y="507" fill="#E9F0F3" font-size="20.83" font-family="Georgia, serif"><tspan x="44" dy="0">Unverified</tspan></text><path d="M172 498 L213 498" fill="none" stroke="#344B4A" stroke-width="1.7"/><g><circle cx="213" cy="498" r="12" fill="#5DDBAE" opacity=".06"/><path d="M201 498 H225 M213 486 V510" stroke="#5DDBAE" stroke-width=".8" opacity=".48"/><circle class="star" style="animation-delay:-3.4s" cx="213" cy="498" r="3.5" fill="#5DDBAE"/></g><text x="236" y="507" fill="#B4C6CB" font-size="20.83" font-family="Georgia, serif"><tspan x="236" dy="0">Everything else</tspan></text></svg>
