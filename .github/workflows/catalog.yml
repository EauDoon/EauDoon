name: Public catalog checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its superseded run. Runs on
# main are keyed by commit and never cancelled, because other agents push
# straight to main and each of those commits needs its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          # No lockfile and no dependencies: there is nothing to cache.
          package-manager-cache: false
      - run: npm run check
      # One leg is enough: coverage is the same code on every OS and Node.
      # The threshold flags need Node 22.8 or later.
      - run: npm run coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
      - run: git diff --exit-code
