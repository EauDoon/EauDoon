name: Release

# A pushed vX.Y.Z tag on a main commit becomes a GitHub Release whose notes
# are that version's CHANGELOG.md section, with the npm pack tarball and its
# SHA-256 sum attached. A manual run checks the same steps for a tag that does
# not exist yet and publishes nothing. Nothing is published to npm.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to dry-run against the checked-out branch, for example v1.0.0. A manual run never publishes.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write, and only to create the release.
    permissions:
      contents: write
    env:
      # Passed through the environment, never interpolated into a script.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse a commit that is not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run check
      - name: Check the tag against package.json and CHANGELOG.md
        run: node scripts/version-check.mjs --tag "$TAG"
      - name: Extract the release notes
        run: |
          node scripts/version-check.mjs --notes "$TAG" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Pack and checksum
        run: |
          npm pack
          sha256sum eaudoon-project-catalog-*.tgz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file release-notes.md eaudoon-project-catalog-*.tgz SHA256SUMS
