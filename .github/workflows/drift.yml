name: Catalog drift check

# The push and pull_request path lists are identical. inventory-check imports
# lib/workflows.mjs, which imports most of lib/, so all of lib/ is watched, and
# an edit to this workflow runs it before merge.
on:
  push:
    branches: [main]
    paths:
      - 'catalog.json'
      - 'public-inventory.json'
      - 'package.json'
      - 'lib/**'
      - 'scripts/drift.mjs'
      - 'scripts/inventory-check.mjs'
      - '.github/workflows/drift.yml'
  pull_request:
    paths:
      - 'catalog.json'
      - 'public-inventory.json'
      - 'package.json'
      - 'lib/**'
      - 'scripts/drift.mjs'
      - 'scripts/inventory-check.mjs'
      - '.github/workflows/drift.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its superseded run. Runs on
# main and scheduled runs are keyed by commit and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          # No lockfile and no dependencies: there is nothing to cache.
          package-manager-cache: false
      - run: node scripts/drift.mjs --check
      - run: node scripts/inventory-check.mjs
      # Runs even when --check fails: the artifact exists to diagnose the drift
      # that just failed the build, so it must not be skipped in that case.
      # bash on every OS, so the redirect writes the same UTF-8 bytes on
      # Windows as on Linux.
      - run: node scripts/drift.mjs --json > drift-report.json
        if: always()
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: drift-report-${{ matrix.os }}-${{ matrix.node }}
          path: drift-report.json
